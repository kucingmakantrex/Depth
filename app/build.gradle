plugins {
    id 'com.android.application'
}

android {
    namespace 'id.depthlock.hios'
    compileSdk 34

    defaultConfig {
        applicationId 'id.depthlock.hios'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Hanya untuk kompilasi; kelas aslinya disediakan LSPosed saat berjalan
    compileOnly project(':xposedstub')
}
